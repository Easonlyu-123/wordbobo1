name: Build & Test

on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: 重新录制快照参考图
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/build-test.yml@c11a6f9 # v1.0.0
    with:
      record_snapshots: ${{ inputs.record_snapshots || false }}
