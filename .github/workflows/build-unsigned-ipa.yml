name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and export unsigned IPA
        run: |
          # Archive
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"

          # Export
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist exportOptions.plist \
            | tee /tmp/export.log
          echo "EXPORT EXIT: $?"

      - name: Package IPA
        if: success()
        run: |
          echo "=== IPA dir ==="
          find ./build/ipa -type f 2>/dev/null
          find ./build -name "*.ipa" -type f 2>/dev/null
          
          IPA=$(find ./build -name "*.ipa" -type f | head -1)
          echo "IPA: $IPA"
          if [ -n "$IPA" ]; then
            echo "IPA size:"
            ls -lh "$IPA"
          else
            echo "NO IPA FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log tail ==="
          tail -40 /tmp/archive.log 2>/dev/null
          echo "=== Export log tail ==="
          tail -40 /tmp/export.log 2>/dev/null
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -20
