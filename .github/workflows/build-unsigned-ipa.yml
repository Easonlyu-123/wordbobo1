name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Create Xcode project
        run: |
          mkdir -p WordBoBo.xcodeproj
          cp .github/project.pbxproj WordBoBo.xcodeproj/project.pbxproj
          echo "Xcode project created"

      - name: Build for generic iOS device (no signing)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO

      - name: Locate built .app
        run: |
          set -e
          APP_PATH=$(find . -path "*/build/Products/Release-iphoneos/*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          ls -la "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="${{ env.APP_PATH }}"
          mkdir -p ~/ipa/Payload
          cp -R "$APP_PATH" ~/ipa/Payload/WordBoBo.app
          rm -f ~/ipa/Payload/WordBoBo.app/embedded.mobileprovision 2>/dev/null || true
          cd ~/ipa
          zip -r WordBoBo-unsigned.ipa Payload/
          ls -lh WordBoBo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
