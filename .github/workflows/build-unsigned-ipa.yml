name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for device (with signing)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9J9BX9XZXZ \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find and strip signature, package IPA
        if: success()
        run: |
          echo "=== All .app ==="
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -10
          echo "=== Build log - built product ==="
          grep -i "built.*app\|TARGET_BUILD_DIR\|PRODUCT_NAME" /tmp/build.log | tail -20
          
          APP=$(find /Users/runner -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -z "$APP" ]; then
            echo "NO APP FOUND"
            exit 1
          fi
          
          # Strip all signatures
          echo "=== Stripping signatures ==="
          find "$APP" -type f -exec xcrun codesign --remove {} \; 2>/dev/null || true
          xcrun codesign --remove "$APP/WordBoBo" 2>/dev/null || true
          
          # Remove signature files
          rm -f "$APP/_CodeSignature/"* 2>/dev/null || true
          rm -f "$APP/PlugIns/"*/*/_CodeSignature/* 2>/dev/null || true
          
          # Remove entitlements
          rm -f "$APP/embedded.mobileprovision" 2>/dev/null || true
          
          # Package IPA
          mkdir -p ./build/Payload
          cp -R "$APP" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          echo "=== IPA ==="
          ls -lh ./build/WordBoBo-unsigned.ipa
          
          # Verify unsigned
          xcrun codesign -dv ./build/Payload/WordBoBo.app 2>&1 || echo "Signature removed (expected error)"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log | tail -80
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
