name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Get build settings
        run: |
          xcodebuild -project WordBoBo.xcodeproj -scheme WordBoBo -showBuildSettings 2>&1 | tee /tmp/settings.log

      - name: Build .app (no signing)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            SYMROOT=./build \
            OBJROOT=./build/obj \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Find and package IPA
        run: |
          echo "=== Build settings (BUILT_PRODUCTS_DIR) ==="
          grep "BUILT_PRODUCTS_DIR" /tmp/settings.log | head -5
          echo "=== Find .app ==="
          find . -name "WordBoBo.app" -type d 2>/dev/null
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 4 -name "WordBoBo.app" -type d 2>/dev/null
          echo "=== Build dir contents ==="
          find ./build -type d 2>/dev/null | head -20
          echo "=== Full build log tail ==="
          tail -30 /tmp/build.log

          APP=$(find . -maxdepth 6 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
