name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Build for iOS (any destination, focus on output)
        run: |
          xcodebuild build             -project WordBoBo.xcodeproj             -scheme WordBoBo             -configuration Release             -sdk iphoneos             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             ENABLE_CODE_SIGNING=NO             2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Find .app (all locations)
        run: |
          echo "=== Search everywhere ==="
          find /Users/runner -name "WordBoBo.app" -type d 2>&1 | head -5
          find /Users/runner -name "*.app" -type d 2>&1 | head -10
          find . -name "*.app" -type d 2>&1 | head -10
          echo "=== DerivedData Contents ==="
          find ./DerivedData -maxdepth 5 -type d 2>&1 | head -30
          echo "=== Build Products ==="
          find ./DerivedData -path "*/Build/Products/*" 2>&1 | head -20
          APP_PATH=$(find /Users/runner -name "WordBoBo.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner -name "*.app" -type d | head -1)
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            tail -20 /tmp/build.log
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Package IPA
        run: |
          APP_PATH="${{ env.APP_PATH }}"
          mkdir -p ~/ipa/Payload
          cp -R "$APP_PATH" ~/ipa/Payload/WordBoBo.app
          cd ~/ipa
          zip -r WordBoBo-unsigned.ipa Payload/
          ls -lh WordBoBo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
