name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify project works
        run: |
          xcodebuild -project WordBoBo.xcodeproj -list 2>&1
          echo "LIST EXIT: $?"

      - name: Build for any available simulator
        run: |
          # Get first available simulator runtime
          RUNTIME=$(xcrun simctl list runtimes available | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+' | head -1)
          echo "Runtime: $RUNTIME"
          
          # Get first available device
          DEVICE=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          echo "Device: $DEVICE"
          
          # Boot it
          xcrun simctl boot "$DEVICE" 2>&1 || true
          sleep 3
          
          # Build
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app
        if: success()
        run: |
          echo "=== Full find ==="
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
          echo "=== Build log grep ==="
          grep -i "error:\|warning:\|built.*product\|target.*output\|skipping\|sdk.*not" /tmp/build.log | tail -30
          
          APP=$(find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat /tmp/build.log
          echo "=== Simulators ==="
          xcrun simctl list devices available 2>&1 | head -20
          echo "=== Runtimes ==="
          xcrun simctl list runtimes available 2>&1 | head -20
