name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: |
          xcrun simctl list devices available 2>&1

      - name: Build .app for iOS Simulator
        run: |
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            BUILD_DIR=./build/Products \
            BUILD_ROOT=./build \
            OBJROOT=./build/obj \
            SYMROOT=./build \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app in known locations
        run: |
          echo "=== Build/Products ==="
          ls -la ./build/Products/ 2>/dev/null || echo "No Products dir"
          find ./build -name "*.app" -type d 2>/dev/null
          echo "=== DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -name "WordBoBo.app" -type d 2>/dev/null
          echo "=== Log: last built product ==="
          grep -i "built.*product\|target.*output\|writing.*objects" /tmp/build.log | tail -10

      - name: Package IPA
        if: success()
        run: |
          APP=$(find ./build -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Build log ==="
          tail -80 /tmp/build.log
