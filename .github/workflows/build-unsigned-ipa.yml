name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          echo "SIM: $SIM"

      - name: Archive for simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: ${PIPESTATUS[0]}"

      - name: Find .app everywhere
        if: success()
        run: |
          echo "=== xcarchive top ==="
          ls -la ./build/WordBoBo.xcarchive/ 2>/dev/null
          echo "=== Products ==="
          ls -la ./build/WordBoBo.xcarchive/Products/ 2>/dev/null
          find ./build/WordBoBo.xcarchive/Products -type d 2>/dev/null | head -20
          echo "=== All .app in xcarchive ==="
          find ./build/WordBoBo.xcarchive -name "*.app" -type d 2>/dev/null
          echo "=== All .app in DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -10
          echo "=== Archive log - built product paths ==="
          grep -i "built.*app\|product.*path\|PRODUCT_NAME\|TARGET_BUILD_DIR" /tmp/archive.log | tail -20

      - name: Package IPA
        if: success()
        run: |
          # Search everywhere for the .app
          APP=$(find ./build -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d | head -1)
          fi
          if [ -z "$APP" ]; then
            APP=$(find /Users/runner -name "WordBoBo.app" -type d | head -1)
          fi
          
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND ANYWHERE"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log ==="
          cat /tmp/archive.log
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -30
