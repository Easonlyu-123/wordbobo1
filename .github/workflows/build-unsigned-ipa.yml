name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version and list simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build for simulator (normal build with signing)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          echo "Using SIM: $SIM"
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9J9BX9XZXZ \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app everywhere and package IPA
        if: success()
        run: |
          echo "=== Build log - last 40 lines ==="
          tail -40 /tmp/build.log
          echo "=== All .app on system ==="
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -20
          echo "=== DerivedData products ==="
          find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*" -type d 2>/dev/null | head -20
          
          APP=$(find /Users/runner -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -z "$APP" ]; then
            echo "NO APP FOUND"
            exit 1
          fi
          
          # Strip all signatures to make it unsigned
          xcrun codesign --remove "$APP/WordBoBo" 2>/dev/null || true
          rm -rf "$APP/_CodeSignature" 2>/dev/null || true
          rm -f "$APP/embedded.mobileprovision" 2>/dev/null || true
          
          # Package IPA
          mkdir -p ./build/Payload
          cp -R "$APP" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          echo "=== IPA ==="
          ls -lh ./build/WordBoBo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          tail -60 /tmp/build.log
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
          echo "=== DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 4 -type d 2>/dev/null | head -30
