name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for generic iOS (no signing flags)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Find .app
        if: success()
        run: |
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -20
          echo "=== DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -name "WordBoBo.app" -type d 2>/dev/null | head -5
          echo "=== Log grep ==="
          grep -i "\.app\|built product\|error:" /tmp/build.log | tail -20
          
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log
