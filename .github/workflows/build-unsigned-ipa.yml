name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show project settings
        run: |
          xcodebuild -project WordBoBo.xcodeproj -showBuildSettings -configuration Release 2>&1 | grep -i "sign\|code\|team\|arch" | head -20
      - name: Archive for device
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            -allowProvisioningUpdates \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"
          ls -la ./build/ 2>&1 || true
          if [ -d "./build/WordBoBo.xcarchive" ]; then
            echo "ARCHIVE FOUND!"
            ls -la ./build/WordBoBo.xcarchive/
          fi
      - name: Check archive result
        run: |
          if [ ! -d "./build/WordBoBo.xcarchive" ]; then
            echo "Archive not found. Log:"
            tail -50 /tmp/archive.log
            exit 1
          fi
      - name: Export IPA
        run: |
          cat > /tmp/exportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>ad-hoc</string>
    <key>signingStyle</key>
    <string>automatic</string>
    <key>compileBitcode</key>
    <false/>
    <key>destination</key>
    <string>export</string>
</dict>
</plist>
EOF
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist /tmp/exportOptions.plist \
            2>&1 | tee /tmp/export.log
          echo "EXPORT EXIT: $?"
          ls -la ./build/output/ 2>&1 || true
      - name: Verify and upload
        run: |
          if [ -f "./build/output/WordBoBo.ipa" ]; then
            echo "IPA ready!"
            ls -lh ./build/output/WordBoBo.ipa
            unzip -l ./build/output/WordBoBo.ipa | head -5
          else
            echo "No IPA found"
            tail -30 /tmp/export.log
            exit 1
          fi
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/output/*.ipa
          retention-days: 30
