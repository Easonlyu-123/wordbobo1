name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app
        run: |
          set -o pipefail
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            BUILD_DIR=./build/Products \
            BUILD_ROOT=./build \
            OBJROOT=./build/obj \
            SYMROOT=./build \
            2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD EXIT: $BUILD_EXIT"

          # Try to extract .app path from build log
          APP_PATH=$(grep -oE '"/[^"]*WordBoBo\.app"' /tmp/build.log | head -1 | tr -d '"')
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          fi
          echo "APP_PATH: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi

      - name: Package IPA
        if: success()
        run: |
          APP="${{ env.APP_PATH }}"
          echo "APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND at: $APP"
            find . -maxdepth 10 -name "*.app" -type d 2>/dev/null | head -10
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          tail -60 /tmp/build.log 2>/dev/null
          find ./build -type d 2>/dev/null | head -20
