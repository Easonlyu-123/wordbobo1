name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive .app
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -archivePath ./build/WordBoBo.xcarchive \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"

      - name: Extract .app from archive and package IPA
        if: success()
        run: |
          echo "=== Archive contents ==="
          find ./build/WordBoBo.xcarchive -type d 2>/dev/null | head -20
          
          # Find .app inside xcarchive
          APP_PATH=$(find ./build/WordBoBo.xcarchive -name "WordBoBo.app" -type d | head -1)
          echo "APP in archive: $APP_PATH"
          
          if [ -n "$APP_PATH" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP_PATH" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP IN ARCHIVE"
            echo "=== Full archive tree ==="
            find ./build/WordBoBo.xcarchive 2>/dev/null | head -30
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log ==="
          cat /tmp/archive.log
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -20
