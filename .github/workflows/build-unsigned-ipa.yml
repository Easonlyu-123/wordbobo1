name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Build for iOS Simulator (produces .app)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,id=00008101-0014D3C222D8801E' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/build.log
          echo "EXIT: $?"

      - name: Find .app and package IPA
        run: |
          APP=$(find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "WordBoBo.app not found, searching all .app:"
            find /Users/runner -name "*.app" -type d 2>/dev/null | head -10
            tail -20 /tmp/build.log
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p ~/ipa/Payload
          cp -R "$APP" ~/ipa/Payload/WordBoBo.app
          cd ~/ipa && zip -r WordBoBo-unsigned.ipa Payload/
          ls -lh ~/ipa/WordBoBo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
