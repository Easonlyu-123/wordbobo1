name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Create Xcode project and scheme
        run: |
          cd "${{ github.workspace }}"
          
          mkdir -p WordBoBo.xcodeproj/xcshareddata/xcschemes
          
          # Write project.pbxproj with consistent IDs
          cat > WordBoBo.xcodeproj/project.pbxproj << 'PBXEOF'
