name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Show generated project structure
        run: |
          ls -la WordBoBo.xcodeproj/
          ls -la WordBoBo/
          xcodebuild -list -project WordBoBo.xcodeproj 2>&1 | tee /tmp/xcodebuild_list.log

      - name: Archive for generic iOS device
        run: |
          xcodebuild archive -project WordBoBo.xcodeproj -scheme WordBoBo -configuration Release -destination 'generic/platform=iOS' -archivePath ./build/WordBoBo.xcarchive CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_CODE_SIGNING=NO 2>&1 | tee /tmp/archive.log

      - name: Check archive result and show log on failure
        run: |
          if [ -d "./build/WordBoBo.xcarchive" ]; then
            echo "SUCCESS: Archive created"
            ls -la ./build/WordBoBo.xcarchive/
          else
            echo "FAILED: No archive found"
            echo "=== Archive log ==="
            cat /tmp/archive.log
            exit 1
          fi

      - name: Export unsigned IPA
        run: |
          mkdir -p ./build/output
          xcodebuild -exportArchive -archivePath ./build/WordBoBo.xcarchive -exportPath ./build/output -exportOptionsPlist ./exportOptions.plist CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/export.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/output/*.ipa
          retention-days: 30
