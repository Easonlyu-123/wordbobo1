name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app for simulator and capture everything
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          echo "SIM: $SIM"

          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD EXIT: $BUILD_EXIT"

          # Save diagnostics
          echo "=== Build log tail ===" >> /tmp/diag.log
          tail -30 /tmp/build.log >> /tmp/diag.log
          echo "=== Find .app in common paths ===" >> /tmp/diag.log
          find ./build -name "*.app" -type d 2>/dev/null >> /tmp/diag.log
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -name "WordBoBo.app" -type d 2>/dev/null >> /tmp/diag.log
          find /Users/runner -maxdepth 8 -name "WordBoBo.app" -type d 2>/dev/null >> /tmp/diag.log
          echo "=== DONE ===" >> /tmp/diag.log
          cat /tmp/diag.log

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build failed"
            exit 1
          fi

          APP=$(grep "^/.*WordBoBo.app" /tmp/diag.log | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/diag.log
          cat /tmp/build.log
