name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create ad-hoc provisioning profile
        run: |
          # Create a self-signed cert for ad-hoc signing
          security create-keychain -p "" build.keychain
          security import /Applications/Xcode.app/Contents/Resources/UserCertificates/Apple\ Development\ iOS\ Signing\ Cert.cer -k build.keychain -A 2>/dev/null || true
          security list-keychains -d user
          
          # Use Xcode's built-in ability to create ad-hoc signed build
          # Set up a dummy development team and let Xcode handle provisioning
          defaults write com.apple.dt.Xcode IDECodeSigningRepair -bool YES 2>/dev/null || true

      - name: Build and archive for device
        run: |
          # Use a real device destination with Xcode auto-provisioning
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -archivePath ./build/WordBoBo.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9J9BX9XZXZ \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: ${PIPESTATUS[0]}"

      - name: Export IPA
        if: success()
        run: |
          echo "=== xcarchive tree ==="
          find ./build/WordBoBo.xcarchive -maxdepth 4 -type d 2>/dev/null
          echo "=== Products ==="
          ls -la ./build/WordBoBo.xcarchive/Products/ 2>/dev/null
          
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist exportOptions.plist \
            2>&1 | tee /tmp/export.log
          echo "EXPORT EXIT: ${PIPESTATUS[0]}"

      - name: Show IPA
        if: success()
        run: |
          find ./build -name "*.ipa" -type f 2>/dev/null
          ls -lh ./build/ipa/ 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log ==="
          cat /tmp/archive.log 2>/dev/null | tail -60
          echo "=== Export log ==="
          cat /tmp/export.log 2>/dev/null | tail -30
          echo "=== xcarchive ==="
          find ./build -type d 2>/dev/null | head -30
