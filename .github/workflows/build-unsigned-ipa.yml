name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app with explicit output path
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            TARGET_BUILD_DIR=./build/Products/Release-iphoneos \
            FULL_PRODUCT_NAME=WordBoBo.app \
            BUILT_PRODUCTS_DIR=./build/Products/Release-iphoneos \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Package IPA
        if: success()
        run: |
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -30
          echo "=== Log grep ==="
          grep -i "target.build.dir\|built.products\|product.path\|full.product" /tmp/build.log | head -10
          
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          tail -60 /tmp/build.log 2>/dev/null
          find ./build -type d 2>/dev/null | head -30
