name: Build Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Generate Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build for generic iOS device (no signing)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO

      - name: Locate built .app
        run: |
          set -e
          # Search in build/Products relative to project
          cd "${{ github.workspace }}"
          APP_PATH=$(find . -path "*/build/Products/Release-iphoneos/*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

          # Show binary info
          ls -la "$APP_PATH"
          file "$APP_PATH/WordBoBo"

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="${{ env.APP_PATH }}"
          echo "Packaging: $APP_PATH"

          # Create IPA structure
          mkdir -p ~/ipa/Payload
          cp -R "$APP_PATH" ~/ipa/Payload/WordBoBo.app

          # Remove any embedded provisioning profile
          rm -f ~/ipa/Payload/WordBoBo.app/embedded.mobileprovision 2>/dev/null || true

          # Strip signature if present
          /usr/bin/xcrun codesign --remove "$APP_PATH/WordBoBo" 2>/dev/null || true

          # Zip as IPA
          cd ~/ipa
          zip -r WordBoBo-unsigned.ipa Payload/

          echo "=== IPA Info ==="
          ls -lh WordBoBo-unsigned.ipa
          echo "=== IPA Contents ==="
          unzip -l WordBoBo-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
