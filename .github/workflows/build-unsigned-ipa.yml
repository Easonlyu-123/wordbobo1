name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Verify xcodeproj
        run: |
          ls -la WordBoBo.xcodeproj/
          test -f WordBoBo.xcodeproj/project.pbxproj && echo "pbxproj OK" || exit 1
          xcodebuild -project WordBoBo.xcodeproj -list 2>&1 | head -10
      - name: Archive for device
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            -allowProvisioningUpdates \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"
          ls -la ./build/ 2>&1 || true
          if [ -d "./build/WordBoBo.xcarchive" ]; then
            echo "ARCHIVE FOUND!"
            ls -la ./build/WordBoBo.xcarchive/
          fi
      - name: Check archive result
        run: |
          if [ ! -d "./build/WordBoBo.xcarchive" ]; then
            echo "Archive not found. Log:"
            tail -60 /tmp/archive.log
            exit 1
          fi
      - name: Export IPA
        run: |
          python3 -c "
import plistlib
pl = dict(method='ad-hoc', signingStyle='automatic', compileBitcode=False)
with open('/tmp/exportOptions.plist','wb') as f: plistlib.dump(pl, f)
print('exportOptions.plist created')
"
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist /tmp/exportOptions.plist \
            2>&1 | tee /tmp/export.log
          echo "EXPORT EXIT: $?"
          ls -la ./build/output/ 2>&1 || true
      - name: Verify and upload IPA
        run: |
          if [ -f "./build/output/WordBoBo.ipa" ]; then
            echo "IPA ready!"
            ls -lh ./build/output/WordBoBo.ipa
          else
            echo "No IPA found"
            tail -30 /tmp/export.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/output/*.ipa
          retention-days: 30
