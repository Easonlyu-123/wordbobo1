name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find available simulator
        id: find_sim
        run: |
          SIM=$(xcrun simctl list devices available | grep -E "iPhone .* \(.*17\." | head -1 | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          if [ -z "$SIM" ]; then
            SIM=$(xcrun simctl list devices available | grep -E "iPhone .* \(" | head -1 | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          fi
          echo "sim_id=$SIM" >> $GITHUB_OUTPUT
          echo "SIMULATOR: $SIM"

      - name: Build, find, and package IPA
        run: |
          SIM="${{ steps.find_sim.outputs.sim_id }}"
          echo "Using simulator: $SIM"
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

          # Find .app
          echo "=== Search for .app ==="
          find . -name "WordBoBo.app" -type d 2>/dev/null
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name "WordBoBo.app" -type d 2>/dev/null | head -5
          echo "=== Log grep ==="
          grep -i "built.*product\|target.*output\|error:" /tmp/build.log | tail -20
          
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log
