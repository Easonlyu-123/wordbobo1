name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive for generic iOS
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -archivePath ./build/WordBoBo.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: ${PIPESTATUS[0]}"

      - name: Export unsigned IPA
        if: success()
        run: |
          echo "=== xcarchive tree ==="
          find ./build/WordBoBo.xcarchive -maxdepth 3 -type d 2>/dev/null
          
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist exportOptions.plist \
            2>&1 | tee /tmp/export.log
          echo "EXPORT EXIT: ${PIPESTATUS[0]}"

      - name: Show IPA
        if: success()
        run: |
          find ./build -name "*.ipa" -type f 2>/dev/null
          ls -lh ./build/ipa/ 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log ==="
          tail -40 /tmp/archive.log 2>/dev/null
          echo "=== Export log ==="
          cat /tmp/export.log 2>/dev/null
          echo "=== xcarchive ==="
          find ./build -type d 2>/dev/null | head -20
