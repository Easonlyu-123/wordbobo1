name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Build for device (arm64)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            SYMROOT=./build \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"
      - name: Find built binary
        run: |
          echo "=== Build dir ==="
          find ./build -type f 2>/dev/null | head -30
          echo "=== Derived data ==="
          find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo" -type f 2>/dev/null | head -5
          echo "=== Any binary ==="
          find . -name "WordBoBo" -type f 2>/dev/null | head -5
          find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/*" 2>/dev/null | head -10
      - name: Package IPA
        run: |
          BINARY=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/WordBoBo" -type f | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find . -name "WordBoBo" -type f | head -1)
          fi
          echo "Binary: $BINARY"
          if [ -z "$BINARY" ]; then
            echo "No binary found!"
            tail -40 /tmp/build.log
            exit 1
          fi
          echo "Arch:"
          file "$BINARY"
          lipo -info "$BINARY"
          # Build .app structure
          APP_DIR=./build/WordBoBo.app
          mkdir -p "$APP_DIR"
          cp "$BINARY" "$APP_DIR/WordBoBo"
          cp WordBoBo/Info.plist "$APP_DIR/"
          mkdir -p "$APP_DIR/_CodeSignature"
          touch "$APP_DIR/_CodeSignature/CodeResources"
          mkdir -p "$APP_DIR/PlugIns"
          cp -r WordBoBo/Resources "$APP_DIR/" 2>/dev/null || true
          cp -r WordBoBo/Assets.xcassets "$APP_DIR/" 2>/dev/null || true
          # Package IPA
          mkdir -p ./build/Payload
          cp -R "$APP_DIR" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          echo "=== IPA ==="
          ls -lh ./build/WordBoBo-unsigned.ipa
          unzip -l ./build/WordBoBo-unsigned.ipa | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
