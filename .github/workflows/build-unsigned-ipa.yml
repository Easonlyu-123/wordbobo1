name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify xcodeproj
        run: |
          ls -la WordBoBo.xcodeproj/
          test -f WordBoBo.xcodeproj/project.pbxproj && echo "pbxproj OK" || exit 1
          xcodebuild -project WordBoBo.xcodeproj -list 2>&1 | head -10
      - name: Archive for device
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"
          ls -la ./build/ 2>&1 || true
          if [ -d "./build/WordBoBo.xcarchive" ]; then
            echo "ARCHIVE FOUND!"
            ls -la ./build/WordBoBo.xcarchive/
            ls -la ./build/WordBoBo.xcarchive/Products/
          fi
      - name: Check archive result
        run: |
          if [ ! -d "./build/WordBoBo.xcarchive" ]; then
            echo "Archive not found. Log:"
            tail -80 /tmp/archive.log
            exit 1
          fi
      - name: Package IPA
        run: |
          APP_PATH=$(find ./build/WordBoBo.xcarchive/Products -name "*.app" -type d | head -1)
          echo "APP: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive"
            find ./build/WordBoBo.xcarchive -type f | head -20
            exit 1
          fi
          file "$APP_PATH/WordBoBo" 2>/dev/null || file "$APP_PATH"/* 2>/dev/null || true
          lipo -info "$APP_PATH/WordBoBo" 2>/dev/null || true
          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          ls -lh ./build/WordBoBo-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
