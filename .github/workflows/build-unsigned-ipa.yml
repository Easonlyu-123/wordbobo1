name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Create Xcode project
        run: |
          mkdir -p WordBoBo.xcodeproj/xcshareddata/xcschemes
          cp .github/project.pbxproj WordBoBo.xcodeproj/project.pbxproj
          cp .github/WordBoBo.xcscheme WordBoBo.xcodeproj/xcshareddata/xcschemes/

      - name: Copy sources into project
        run: |
          mkdir -p WordBoBo/Resources WordBoBo/Assets.xcassets
          cp WordBoBo/WordBoBoApp.swift WordBoBo/
          cp WordBoBo/Views/ContentView.swift WordBoBo/
          cp WordBoBo/Views/CameraPreviewView.swift WordBoBo/
          cp WordBoBo/Views/WordConfirmView.swift WordBoBo/
          cp WordBoBo/Views/StudyRouterView.swift WordBoBo/
          cp WordBoBo/Views/StudyStage1View.swift WordBoBo/
          cp WordBoBo/Views/StudyStage2View.swift WordBoBo/
          cp WordBoBo/Views/StudyStage3View.swift WordBoBo/
          cp WordBoBo/Views/HistoryView.swift WordBoBo/
          cp WordBoBo/Views/ManualInputView.swift WordBoBo/
          cp WordBoBo/Models/Word.swift WordBoBo/
          cp WordBoBo/Services/WordStore.swift WordBoBo/
          cp WordBoBo/Services/OCRService.swift WordBoBo/
          cp WordBoBo/Info.plist WordBoBo/
          cp WordBoBo/Resources/WordBoBo.entitlements WordBoBo/Resources/
          echo '{"info":{"version":1,"author":"xcode"}}' > WordBoBo/Assets.xcassets/Contents.json

      - name: Remove SceneDelegate (using @main App lifecycle)
        run: |
          rm -f WordBoBo/SceneDelegate.swift

      - name: Build and archive for generic iOS device
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO

      - name: Export unsigned IPA
        run: |
          python3 -c "
import plistlib
pl = {
    'method': 'generic',
    'signingStyle': 'manual',
    'compileBitcode': False,
    'destination': 'export',
}
with open('/tmp/exportOptions.plist', 'wb') as f:
    plistlib.dump(pl, f)
"
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist /tmp/exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/output/*.ipa
          retention-days: 30
