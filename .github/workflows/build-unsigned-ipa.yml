name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator with derivedDataPath
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app in derived data and package IPA
        if: success()
        run: |
          echo "=== DerivedData tree ==="
          find ./DerivedData -maxdepth 6 -type d 2>/dev/null | head -40
          echo "=== All .app in DerivedData ==="
          find ./DerivedData -name "*.app" -type d 2>/dev/null | head -10
          echo "=== Build log grep ==="
          grep -i "TARGET_BUILD_DIR\|BUILT_PRODUCTS_DIR\|PRODUCT_NAME\|built\|error:" /tmp/build.log | tail -30
          
          # Look in multiple places
          APP=$(find ./DerivedData -name "WordBoBo.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          fi
          echo "APP: $APP"
          
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log | tail -60
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
