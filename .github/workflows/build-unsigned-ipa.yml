name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available devices
        run: |
          xcrun xctrace list devices 2>&1 | tee /tmp/devices.log
          xcrun simctl list devices available 2>&1 | tee -a /tmp/devices.log

      - name: Archive with physical device destination
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_CODE_SIGNING=YES \
            2>&1 | tee /tmp/archive.log
          echo "EXIT: $?"
          ls -la ./build/ 2>&1 || true
          file ./build/WordBoBo.xcarchive 2>&1 || true
          echo "=== Archive log tail ==="
          tail -30 /tmp/archive.log

      - name: Check archive and export
        run: |
          if [ ! -d "./build/WordBoBo.xcarchive" ]; then
            echo "Archive not found, trying build+manual packaging..."
            xcodebuild build \
              -project WordBoBo.xcodeproj \
              -scheme WordBoBo \
              -configuration Release \
              -destination 'platform=iOS Simulator,name=iPhone 17' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ENABLE_CODE_SIGNING=NO \
              2>&1 | tee /tmp/sim_build.log
            echo "SIM BUILD EXIT: $?"
            APP=$(find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP" ]; then
              echo "No .app from simulator either"
              tail -20 /tmp/sim_build.log
              exit 1
            fi
            echo "Simulator app: $APP"
            mkdir -p ~/ipa/Payload
            cp -R "$APP" ~/ipa/Payload/WordBoBo.app
            cd ~/ipa && zip -r WordBoBo-unsigned.ipa Payload/
          else
            echo "Archive found, exporting..."
            xcodebuild -exportArchive \
              -archivePath ./build/WordBoBo.xcarchive \
              -exportPath ./build/output \
              -exportOptionsPlist ./exportOptions.plist \
              2>&1 | tee /tmp/export.log
            echo "EXPORT EXIT: $?"
          fi
          ls -lh ~/ipa/WordBoBo-unsigned.ipa 2>&1 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
