name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          echo "SIM: $SIM"

      - name: Build .app for simulator (no signing flags)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Package IPA
        if: success()
        run: |
          echo "=== Build log - last 30 lines ==="
          tail -30 /tmp/build.log
          echo "=== Find .app ==="
          find . -maxdepth 10 -name "WordBoBo.app" -type d 2>/dev/null | head -10
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name "WordBoBo.app" -type d 2>/dev/null | head -5
          
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
