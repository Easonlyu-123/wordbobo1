name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Archive (relaxed signing)
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            ALLOW_PROVISIONING_UPDATES=YES \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"
          echo "=== Archive path check ==="
          ls -la ./build/ 2>&1 || true
          file ./build/WordBoBo.xcarchive 2>&1 || true

      - name: Check and export IPA
        run: |
          if [ -d "./build/WordBoBo.xcarchive" ]; then
            echo "Archive exists, exporting..."
            xcodebuild -exportArchive \
              -archivePath ./build/WordBoBo.xcarchive \
              -exportPath ./build/output \
              -exportOptionsPlist ./exportOptions.plist \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee /tmp/export.log
            echo "EXPORT EXIT: $?"
            ls -la ./build/output/ 2>&1 || true
          else
            echo "Archive not found"
            tail -30 /tmp/archive.log
            exit 1
          fi

      - name: Verify IPA
        run: |
          if [ -f "./build/output/WordBoBo-unsigned.ipa" ]; then
            echo "IPA found!"
            ls -lh ./build/output/WordBoBo-unsigned.ipa
          else
            echo "No IPA file!"
            echo "=== Export log ==="
            cat /tmp/export.log | tail -30
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/output/*.ipa
          retention-days: 30
