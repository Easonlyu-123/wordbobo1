name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator
        run: |
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9J9BX9XZXZ \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app and package IPA
        if: success()
        run: |
          echo "=== DerivedData tree ==="
          find ./DerivedData -maxdepth 6 -type d 2>/dev/null | head -40
          echo "=== All .app ==="
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -10
          echo "=== Log grep ==="
          grep -i "TARGET_BUILD_DIR\|BUILT_PRODUCTS_DIR\|built\|error:" /tmp/build.log | tail -30
          
          APP=$(find /Users/runner -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -n "$APP" ]; then
            # Strip signatures
            rm -rf "$APP/_CodeSignature" 2>/dev/null || true
            rm -f "$APP/embedded.mobileprovision" 2>/dev/null || true
            xcrun codesign --remove "$APP/WordBoBo" 2>/dev/null || true
            # Package IPA
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log | tail -60
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
          echo "=== DerivedData ==="
          find ./DerivedData -maxdepth 6 -type d 2>/dev/null | head -30
