name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Build for generic iOS device
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Find .app everywhere
        run: |
          echo "=== Search 1: build/Products ==="
          find . -path "*/build/Products/*" -name "*.app" -type d 2>&1
          echo "=== Search 2: DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>&1 | head -10
          echo "=== Search 3: all .app ==="
          find . -name "*.app" -type d 2>&1
          echo "=== Search 4: build dir ==="
          find ./build -type f -o -type d 2>&1 | head -30
          echo "=== Build log tail ==="
          tail -30 /tmp/build.log

      - name: Package IPA
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found anywhere, cannot create IPA"
            exit 1
          fi
          mkdir -p ~/ipa/Payload
          cp -R "$APP_PATH" ~/ipa/Payload/WordBoBo.app
          cd ~/ipa
          zip -r WordBoBo-unsigned.ipa Payload/
          ls -lh WordBoBo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
