name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find and boot simulator
        id: sim
        run: |
          xcrun simctl list runtimes available 2>&1 | head -10
          echo "---"
          xcrun simctl list devices available 2>&1 | head -20
          
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          echo "sim_id=$SIM" >> $GITHUB_OUTPUT
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          echo "Booted: $SIM"

      - name: Build .app for simulator
        run: |
          SIM="${{ steps.sim.outputs.sim_id }}"
          echo "Building for simulator: $SIM"
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"
          
          echo "=== BUILD LOG ==="
          cat /tmp/build.log

      - name: Find .app in DerivedData
        if: success()
        run: |
          echo "=== All .app on system ==="
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null
          echo "=== DerivedData tree ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 4 -type d 2>/dev/null | head -30
          
          # Also grep build log for product path
          echo "=== Log product references ==="
          grep -i "product\|target\|\.app\|build/" /tmp/build.log | grep -v "^--" | tail -20

      - name: Package IPA
        if: success()
        run: |
          APP=$(find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show all logs on failure
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat /tmp/build.log
          echo "=== ALL .APP ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
