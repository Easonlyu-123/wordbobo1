name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"

      - name: Export IPA
        if: success()
        run: |
          echo "=== Archive contents ==="
          find ./build/WordBoBo.xcarchive -maxdepth 2 -type d 2>/dev/null | head -20
          
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist exportOptions.plist \
            | tee /tmp/export.log
          echo "EXPORT EXIT: $?"

      - name: Show IPA
        if: success()
        run: |
          find ./build -name "*.ipa" -type f 2>/dev/null
          ls -lh ./build/ipa/ 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/ipa/*.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log tail ==="
          tail -40 /tmp/archive.log 2>/dev/null
          echo "=== Export log tail ==="
          tail -40 /tmp/export.log 2>/dev/null
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -20
