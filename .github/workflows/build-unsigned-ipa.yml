name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for device with signing, save log with build settings
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9J9BX9XZXZ \
            -showBuildSettings \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app and package IPA
        if: success()
        run: |
          echo "=== TARGET_BUILD_DIR from log ==="
          grep "TARGET_BUILD_DIR" /tmp/build.log | head -5
          echo "=== FULL_BUILD_PRODUCT ==="
          grep "FULL_BUILD_PRODUCT" /tmp/build/log | head -5
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -20
          
          APP=$(find /Users/runner -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -z "$APP" ]; then
            echo "NO APP"
            exit 1
          fi
          
          # Strip signatures
          xcrun codesign --remove "$APP/WordBoBo" 2>/dev/null || true
          rm -f "$APP/_CodeSignature/CodeSignature" 2>/dev/null || true
          rm -f "$APP/embedded.mobileprovision" 2>/dev/null || true
          
          # Package IPA
          mkdir -p ./build/Payload
          cp -R "$APP" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          ls -lh ./build/WordBoBo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          grep -E "TARGET_BUILD_DIR|FULL_BUILD_PRODUCT|BUILT_PRODUCTS_DIR" /tmp/build.log | head -10
          echo "=== All .app ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
          cat /tmp/build.log | tail -30
