name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath ./DerivedData \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app and package IPA
        if: success()
        run: |
          echo "=== DerivedData tree ===" > /tmp/find.log
          find ./DerivedData -maxdepth 6 -type d >> /tmp/find.log
          echo "=== All .app ===" >> /tmp/find.log
          find /Users/runner -name "*.app" -type d 2>/dev/null >> /tmp/find.log
          echo "=== Log grep ===" >> /tmp/find.log
          grep -i "TARGET_BUILD_DIR\|PRODUCT_NAME\|built\|error:\|warning:" /tmp/build.log | tail -30 >> /tmp/find.log
          cat /tmp/find.log
          
          APP=$(find ./DerivedData -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        run: |
          echo "=== Uploading logs ==="
          cat /tmp/find.log
          cat /tmp/build.log | tail -50
          # Save logs to repo for debugging
          cp /tmp/build.log ./build.log
          cp /tmp/find.log ./find.log
          
      - name: Show logs on failure (final)
        if: failure()
        run: |
          echo "=== Build log ==="
          cat /tmp/build.log 2>/dev/null | tail -80
          echo "=== Find log ==="
          cat /tmp/find.log 2>/dev/null
