name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator (not archive, just build)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app and package IPA
        if: success()
        run: |
          echo "=== DerivedData tree ==="
          find ./DerivedData -maxdepth 5 -type d 2>/dev/null | head -30
          echo "=== All .app ==="
          find ./DerivedData -name "*.app" -type d 2>/dev/null | head -10
          echo "=== Build log - product path ==="
          grep -i "TARGET_BUILD_DIR\|PRODUCT_NAME\|\.app" /tmp/build.log | tail -20
          
          APP=$(find ./DerivedData -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
            echo "IPA contains:"
            unzip -l ./build/WordBoBo-unsigned.ipa | head -10
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Build log ==="
          cat /tmp/build.log
          echo "=== All .app on system ==="
          find /Users/runner -name "*.app" -type d 2>/dev/null | head -20
