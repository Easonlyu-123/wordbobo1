name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app and save diagnostics
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

          # Save ALL diagnostic info
          echo "=== Find .app everywhere ===" > /tmp/diag.log
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null >> /tmp/diag.log
          echo "=== DerivedData .app ===" >> /tmp/diag.log
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null >> /tmp/diag.log
          echo "=== Build dir ===" >> /tmp/diag.log
          find ./build -type d 2>/dev/null >> /tmp/diag.log
          echo "=== Log grep .app ===" >> /tmp/diag.log
          grep -i "\\.app" /tmp/build.log >> /tmp/diag.log
          echo "=== DONE ===" >> /tmp/diag.log
          cat /tmp/diag.log

      - name: Package IPA
        if: success()
        run: |
          APP=$(grep "^/.*WordBoBo.app" /tmp/diag.log | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== DIAG LOG ==="
          cat /tmp/diag.log
