name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive for device
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_CODE_SIGNING=YES \
            2>&1 | tee /tmp/archive.log
          echo "EXIT: $?"
          ls -la ./build/ 2>&1 || true

      - name: Check archive
        run: |
          if [ ! -d "./build/WordBoBo.xcarchive" ]; then
            echo "Archive not found:"
            tail -40 /tmp/archive.log
            exit 1
          fi
          echo "Archive OK"
          ls -la ./build/WordBoBo.xcarchive/

      - name: Create export options
        run: |
          cat > /tmp/exportOptions.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>ad-hoc</string>
    <key>signingStyle</key>
    <string>automatic</string>
    <key>compileBitcode</key>
    <false/>
    <key>destination</key>
    <string>export</string>
</dict>
</plist>
PLISTEOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/WordBoBo.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist /tmp/exportOptions.plist \
            2>&1 | tee /tmp/export.log
          echo "EXIT: $?"
          ls -la ./build/output/ 2>&1 || true

      - name: Verify IPA
        run: |
          if [ -f "./build/output/WordBoBo.ipa" ]; then
            echo "IPA ready!"
            ls -lh ./build/output/WordBoBo.ipa
          else
            echo "No IPA found"
            tail -30 /tmp/export.log
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/output/*.ipa
          retention-days: 30
