name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify project structure
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== xcodeproj ==="
          ls -la WordBoBo.xcodeproj/
          test -f WordBoBo.xcodeproj/project.pbxproj && echo "pbxproj exists" || exit 1
          echo "=== Source files ==="
          ls -la WordBoBo/
          echo "=== xcodebuild -list ==="
          xcodebuild -project WordBoBo.xcodeproj -list 2>&1

      - name: Diagnostic build
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            SYMROOT=./build \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Show build log
        run: |
          echo "=== Build log (last 60 lines) ==="
          tail -60 /tmp/build.log

      - name: Package IPA from .app
        run: |
          echo "=== Search for .app ==="
          find ./build -name "*.app" -type d 2>/dev/null
          find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d 2>/dev/null | head -5
          APP=$(find ./build -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d | head -1)
          fi
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND - build may have failed"
            echo "=== All build outputs ==="
            find ./build -type f 2>/dev/null | head -20
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
