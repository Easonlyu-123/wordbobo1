name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app for iOS Simulator
        run: |
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2' \
            | tee /tmp/build.log
          BUILD_STATUS=$?
          echo "BUILD STATUS: $BUILD_STATUS"
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with exit code $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

      - name: Find .app path
        if: success()
        run: |
          echo "=== Search for .app ==="
          find . -maxdepth 10 -name "WordBoBo.app" -type d 2>/dev/null | head -10
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name "WordBoBo.app" -type d 2>/dev/null | head -5
          
          # Get settings to find expected path
          xcrun xcodebuild -project WordBoBo.xcodeproj -scheme WordBoBo -configuration Release -showBuildSettings 2>&1 | tee /tmp/settings.log
          TARGET_BUILD_DIR=$(grep "TARGET_BUILD_DIR = " /tmp/settings.log | head -1 | sed 's/TARGET_BUILD_DIR = //')
          FULL_PRODUCT_NAME=$(grep "FULL_PRODUCT_NAME = " /tmp/settings.log | head -1 | sed 's/FULL_PRODUCT_NAME = //')
          echo "Expected path: $TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          ls -la "$TARGET_BUILD_DIR" 2>/dev/null || echo "Dir not found"

      - name: Package IPA
        if: success()
        run: |
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat /tmp/build.log
          echo "=== SETTINGS LOG ==="
          cat /tmp/settings.log
