name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build for simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          echo "SIM: $SIM"
          
          # Don't boot simulator - just build
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath ./DerivedData \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find and package IPA
        if: success()
        run: |
          echo "=== DerivedData ==="
          find ./DerivedData -maxdepth 6 -type d 2>/dev/null | head -40
          echo "=== All .app ==="
          find . -name "*.app" -type d 2>/dev/null | head -10
          find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d 2>/dev/null | head -5
          echo "=== Log tail ==="
          tail -20 /tmp/build.log
          
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          [ -z "$APP" ] && APP=$(find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -z "$APP" ]; then
            echo "NO APP"
            exit 1
          fi
          
          mkdir -p ./build/Payload
          cp -R "$APP" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          ls -lh ./build/WordBoBo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/build.log | tail -60
          find . -name "*.app" -type d 2>/dev/null | head -10
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -10
