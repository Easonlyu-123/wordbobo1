name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

          # Find .app and write path to file
          APP=$(find /Users/runner -maxdepth 8 -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          echo "$APP" > /tmp/app_path.txt
          echo "APP: $APP"

      - name: Package IPA
        run: |
          APP=$(cat /tmp/app_path.txt)
          echo "APP from file: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== APP path file ==="
          cat /tmp/app_path.txt 2>/dev/null
          echo "=== Build log tail ==="
          tail -60 /tmp/build.log 2>/dev/null
          echo "=== Find results ==="
          find /Users/runner -maxdepth 8 -name "*.app" -type d 2>/dev/null | head -10
