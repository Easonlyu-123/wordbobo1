name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app (no signing)
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            SYMROOT=./build \
            OBJROOT=./build/obj \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Show build log
        if: always()
        run: |
          echo "=== Build log (last 80 lines) ==="
          tail -80 /tmp/build.log

      - name: Locate .app
        if: always()
        run: |
          echo "=== SYMROOT ./build ==="
          find ./build -name "*.app" -type d 2>/dev/null
          echo "=== DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 3 -name "WordBoBo.app" -type d 2>/dev/null
          echo "=== All .app ==="
          find . -maxdepth 5 -name "*.app" -type d 2>/dev/null

      - name: Package IPA
        if: success()
        run: |
          APP=$(find . -maxdepth 5 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            echo "IPA:"
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
