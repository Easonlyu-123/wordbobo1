name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .app and capture settings
        run: |
          set -o pipefail
          
          # Get build settings
          xcodebuild -project WordBoBo.xcodeproj -scheme WordBoBo -configuration Release -showBuildSettings 2>&1 | tee /tmp/settings.log
          
          echo "=== KEY SETTINGS ==="
          grep -E "TARGET_BUILD_DIR|FULL_PRODUCT_NAME|BUILT_PRODUCTS_DIR|PRODUCT_NAME|SDKROOT|PLATFORM_NAME" /tmp/settings.log | head -10
          
          # Build
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'platform=iOS Simulator,OS=17.2,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            BUILD_DIR=./build/Products \
            BUILD_ROOT=./build \
            OBJROOT=./build/obj \
            SYMROOT=./build \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: ${PIPESTATUS[0]}"

          echo "=== SEARCH FOR .app ==="
          find ./build -name "*.app" -type d 2>/dev/null
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name "WordBoBo.app" -type d 2>/dev/null | head -5
          find /Users/runner -maxdepth 6 -name "WordBoBo.app" -type d 2>/dev/null | head -5
          
          echo "=== BUILD LOG - lines with 'app' ==="
          grep -i "\.app\|built product\|target output\|write.*object" /tmp/build.log | tail -20
          
          echo "=== CHECK EXPECTED PATH ==="
          TARGET_BUILD_DIR=$(grep "TARGET_BUILD_DIR" /tmp/settings.log | head -1 | awk '{print $3}')
          FULL_PRODUCT_NAME=$(grep "FULL_PRODUCT_NAME" /tmp/settings.log | head -1 | awk '{print $3}')
          echo "Expected: $TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          ls -la "$TARGET_BUILD_DIR" 2>/dev/null || echo "Dir not found: $TARGET_BUILD_DIR"

          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show full logs on failure
        if: failure()
        run: |
          echo "=== SETTINGS LOG ==="
          cat /tmp/settings.log
          echo "=== BUILD LOG ==="
          cat /tmp/build.log
