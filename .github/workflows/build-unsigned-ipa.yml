name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Get build settings
        run: |
          xcodebuild -project WordBoBo.xcodeproj -scheme WordBoBo -configuration Release -showBuildSettings 2>&1 | tee /tmp/settings.log
          echo "=== KEY SETTINGS ==="
          grep -E "TARGET_BUILD_DIR|FULL_PRODUCT_NAME|BUILT_PRODUCTS_DIR|SDKROOT|PLATFORM_NAME" /tmp/settings.log | head -10

      - name: Build for generic iOS
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"

      - name: Find and package IPA
        run: |
          echo "=== Build dir ==="
          find ./build -type d 2>/dev/null | head -20
          echo "=== Expected path from settings ==="
          TARGET_BUILD_DIR=$(grep "TARGET_BUILD_DIR = " /tmp/settings.log | head -1 | sed 's/TARGET_BUILD_DIR = //')
          FULL_PRODUCT_NAME=$(grep "FULL_PRODUCT_NAME = " /tmp/settings.log | head -1 | sed 's/FULL_PRODUCT_NAME = //')
          echo "Expected: $TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          ls -la "$TARGET_BUILD_DIR" 2>/dev/null || echo "Dir not found"
          
          echo "=== Log grep ==="
          grep -i "\.app\|built product\|error:" /tmp/build.log | tail -20
          
          APP=$(find . -maxdepth 10 -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat /tmp/build.log
          echo "=== SETTINGS ==="
          cat /tmp/settings.log
