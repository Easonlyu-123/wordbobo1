name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Verify project structure
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== xcodeproj ==="
          ls -la WordBoBo.xcodeproj/
          test -f WordBoBo.xcodeproj/project.pbxproj && echo "pbxproj exists" || exit 1
          echo "=== Source files ==="
          ls -la WordBoBo/
          echo "=== xcodebuild -list ==="
          xcodebuild -project WordBoBo.xcodeproj -list 2>&1
      - name: Create export options (unsigned)
        run: |
          cat > /tmp/ExportOptions.plist << 'PLISTEOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>developer-id</string>
    <key>signingCertificate</key>
    <string></string>
    <key>signingStyle</key>
    <string>manual</string>
    <key>teamID</key>
    <string></string>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>thinning</key>
    <string>&lt;none&gt;</string>
</dict>
</plist>
PLISTEOF
          echo "ExportOptions.plist created"
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/WordBoBo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: $?"
      - name: Show archive log
        run: |
          echo "=== Archive log (last 60 lines) ==="
          tail -60 /tmp/archive.log
      - name: Find archive
        run: |
          echo "=== Build dir ==="
          find ./build -type f -o -type d | head -20
          find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.xcarchive" -type d 2>/dev/null | head -5
      - name: Export IPA from archive
        run: |
          ARCHIVE="./build/WordBoBo.xcarchive"
          if [ ! -d "$ARCHIVE" ]; then
            ARCHIVE=$(find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.xcarchive" -type d | head -1)
          fi
          echo "ARCHIVE: $ARCHIVE"
          if [ -n "$ARCHIVE" ]; then
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath ./build \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              2>&1 | tee /tmp/export.log
            echo "EXPORT EXIT: $?"
            echo "=== IPA files ==="
            find ./build -name "*.ipa" -type f -ls 2>/dev/null
          fi
      - name: Fallback: package from .app if export failed
        run: |
          if [ ! -f ./build/WordBoBo-unsigned.ipa ]; then
            echo "No IPA from export, trying fallback..."
            APP=$(find ./build -name "*.app" -type d | head -1)
            if [ -z "$APP" ]; then
              APP=$(find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d | head -1)
            fi
            echo "APP: $APP"
            if [ -n "$APP" ]; then
              mkdir -p ./build/Payload
              cp -R "$APP" ./build/Payload/
              cd ./build
              zip -r WordBoBo-unsigned.ipa Payload/
              cd ..
              echo "IPA:"
              ls -lh ./build/WordBoBo-unsigned.ipa
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
