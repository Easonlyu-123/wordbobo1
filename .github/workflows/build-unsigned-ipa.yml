name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for arm64 iOS
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT=build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            2>&1 | tee /tmp/build.log
          echo "EXIT: $?"

      - name: Debug build output
        run: |
          echo "=== build dir ==="
          find ./build -type f -o -type d 2>&1 | head -30
          echo "=== DerivedData ==="
          find ./DerivedData -type f -name "*.app" 2>&1 | head -5
          echo "=== All .app on system ==="
          find /Users/runner -name "*.app" -type d 2>&1 | head -10
          echo "=== Build log tail ==="
          tail -30 /tmp/build.log

      - name: Package IPA
        run: |
          set -e
          APP=$(find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find /Users/runner -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi
          echo "Packaging: $APP"
          mkdir -p ~/ipa/Payload
          cp -R "$APP" ~/ipa/Payload/WordBoBo.app
          cd ~/ipa && zip -r WordBoBo-unsigned.ipa Payload/
          ls -lh ~/ipa/WordBoBo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ~/ipa/WordBoBo-unsigned.ipa
          retention-days: 30
