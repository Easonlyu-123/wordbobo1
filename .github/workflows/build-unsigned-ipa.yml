name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for arm64 simulator
        run: |
          xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_CODE_SIGNING=NO \
            SYMROOT=./build \
            2>&1 | tee /tmp/build.log
          echo "BUILD EXIT: $?"
      - name: Find and verify .app
        run: |
          echo "=== Search .app ==="
          find . -name "*.app" -type d 2>/dev/null | head -10
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -10
          echo "=== Build dir ==="
          find ./build -type f 2>/dev/null | head -20
          echo "=== Check binary arch ==="
          APP=$(find . -name "WordBoBo.app" -type d | head -1)
          if [ -n "$APP" ]; then
            BIN="$APP/WordBoBo"
            [ -f "$BIN" ] || BIN=$(find "$APP" -maxdepth 1 -type f ! -name "*.nib" ! -name "*.plist" | head -1)
            echo "Binary: $BIN"
            file "$BIN"
            lipo -info "$BIN" 2>/dev/null || true
          fi
      - name: Package IPA manually
        run: |
          APP=$(find . -name "WordBoBo.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "WordBoBo.app" -type d | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "No .app found!"
            cat /tmp/build.log | tail -30
            exit 1
          fi
          echo "Using app: $APP"
          mkdir -p ./build/Payload
          cp -R "$APP" ./build/Payload/
          cd ./build
          zip -r WordBoBo-unsigned.ipa Payload/
          cd ..
          echo "=== IPA info ==="
          ls -lh ./build/WordBoBo-unsigned.ipa
          # Verify
          unzip -l ./build/WordBoBo-unsigned.ipa | head -10
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30
