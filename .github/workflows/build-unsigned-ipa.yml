name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build with SPM
        run: |
          swift build \
            --configuration release \
            --triple arm64-apple-ios15.0 \
            2>&1 | tee /tmp/spm.log
          echo "SPM EXIT: $?"

      - name: Find build products
        if: success()
        run: |
          find .build -type f 2>/dev/null | head -20
          find .build -name "*.app" -type d 2>/dev/null | head -5
          cat /tmp/spm.log | tail -20

      - name: Build with xcodebuild (fallback)
        if: failure()
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 3
          
          xcrun xcodebuild build \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/xcbuild.log
          echo "XCBUILD EXIT: ${PIPESTATUS[0]}"

      - name: Find .app (fallback)
        if: failure()
        run: |
          find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -10
          cat /tmp/xcbuild.log | tail -30

      - name: Package IPA
        if: success()
        run: |
          APP=$(find /Users/runner -name "WordBoBo.app" -type d 2>/dev/null | head -1)
          echo "APP: $APP"
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== SPM LOG ==="
          cat /tmp/spm.log 2>/dev/null
          echo "=== XCBUILD LOG ==="
          cat /tmp/xcbuild.log 2>/dev/null
