name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Create iOS app project using xcodebuild template
        run: |
          cd "${{ github.workspace }}"
          
          # Create from single view app template
          xcodebuild -createProject \
            -projectType "application" \
            -platform iphoneos \
            -template "Single View App" \
            -projectName WordBoBo \
            WordBoBo.xcodeproj 2>&1 || true
          
          # Check what was created
          ls -la WordBoBo.xcodeproj/ 2>/dev/null || echo "template method failed"
          ls WordBoBo.xcodeproj/*.pbxproj 2>/dev/null || echo "no pbxproj"

      - name: Check available templates
        if: always()
        run: |
          ls /Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/Library/Xcode/Templates/File\ Templates/Source/ 2>/dev/null || \
          ls /Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/Library/Xcode/Templates/Project\ Templates/iOS/Application/ 2>/dev/null || \
          echo "checking templates..." && find /Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform -name "*.xctemplate" -maxdepth 5 2>/dev/null | head -20
