name: Build Unsigned IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun simctl boot "$SIM" 2>&1 || true
          sleep 5
          echo "SIM: $SIM"

      - name: Archive for iOS Simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1)
          xcrun xcodebuild archive \
            -project WordBoBo.xcodeproj \
            -scheme WordBoBo \
            -configuration Release \
            -archivePath ./build/WordBoBo.xcarchive \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee /tmp/archive.log
          echo "ARCHIVE EXIT: ${PIPESTATUS[0]}"

      - name: Extract .app from xcarchive and package IPA
        if: success()
        run: |
          echo "=== xcarchive contents ==="
          find ./build/WordBoBo.xcarchive -type f -o -type d 2>/dev/null | head -30
          
          APP=$(find ./build/WordBoBo.xcarchive -name "WordBoBo.app" -type d | head -1)
          echo "APP: $APP"
          
          if [ -n "$APP" ]; then
            mkdir -p ./build/Payload
            cp -R "$APP" ./build/Payload/
            cd ./build
            zip -r WordBoBo-unsigned.ipa Payload/
            cd ..
            ls -lh ./build/WordBoBo-unsigned.ipa
          else
            echo "NO APP IN ARCHIVE"
            echo "=== Archive log ==="
            tail -30 /tmp/archive.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WordBoBo-unsigned-ipa
          path: ./build/WordBoBo-unsigned.ipa
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Archive log ==="
          cat /tmp/archive.log
          echo "=== xcarchive ==="
          find ./build -type d 2>/dev/null | head -20
