name: WordBoBo
options:
  bundleIdPrefix: com.wordbobo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

configs:
  Debug: debug
  Release: release

schemes:
  WordBoBo:
    buildTargets:
      - WordBoBo
    testTargets:
      - WordBoBoTests
    run:
      config: Release

targets:
  WordBoBo:
    type: application
    platform: iOS
    sources: [WordBoBo]
    resources: [WordBoBo/Resources]
    entitlements:
      path: WordBoBo/Resources/WordBoBo.entitlements
      properties:
        com.apple.developer.visionkit.readerdocumentdocumenttypes: true
        com.apple.developer.avfoundation.audio-input: true
        com.apple.developer.speech.recognition: true
    info:
      path: WordBoBo/Info.plist
      properties:
        NSCameraUsageDescription: "需要相机权限来拍照识别单词"
        NSPhotoLibraryUsageDescription: "需要相册权限来选择照片识别单词"
        NSSpeechRecognitionUsageDescription: "需要语音权限来朗读单词发音"
        NSMicrophoneUsageDescription: "需要麦克风权限来朗读单词发音"
        CFBundleDisplayName: "单词背背"
        CFBundleName: "WordBoBo"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            ApplicationSessionRole:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
                UISceneStoryboardFile: Main
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordbobo.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SWIFT_PM

  WordBoBoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WordBoBo
