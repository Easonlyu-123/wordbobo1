name: WordBoBo
options:
  bundleIdPrefix: com.wordbobo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.wordbobo.app
    PRODUCT_NAME: WordBoBo
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_CFBundleDisplayName: 单词背背
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_CODE_SIGNING: NO
    BUILD_DIR: build
    SYMROOT: build
  debug:
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  release:
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: s

targets:
  WordBoBo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WordBoBo
    resources:
      - path: WordBoBo/Resources
      - path: WordBoBo/Assets.xcassets
    info:
      path: WordBoBo/Info.plist
    entitlements:
      path: WordBoBo/Resources/WordBoBo.entitlements
    scheme:
      gatherCoverageData: true
      testTargets: []
