# WordBoBo 的 CI 配置：所有工作流从这里读取设置
# 只写需要修改的键，其余用默认值

workdir: .
project: WordBoBo.xcodeproj
scheme: WordBoBo
bundle_id: com.wordbobo.app
display_name: 单词背背
sync_command: 'true'
generate_command: 'true'
icon_path: ''

toolchain:
  xcode: '26.6'
  simulator: iPhone 17 Pro
  ios: '26.4'

build_test:
  commit_recorded_snapshots: false

testflight:
  entitlement_mode: none
